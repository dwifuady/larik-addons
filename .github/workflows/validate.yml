name: Validate index

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate index and download every add-on
        shell: pwsh
        run: ./scripts/validate.ps1 -VerifyDownloads
